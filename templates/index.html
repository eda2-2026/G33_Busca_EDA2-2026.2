<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Biblioteca Virtual</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="page page-home">
    <section class="search-panel" aria-labelledby="titulo-principal">
      <p class="eyebrow">Catálogo local com {{ total_livros }} livros</p>
      <h1 id="titulo-principal">Biblioteca Virtual</h1>
      <p class="subtitle">Encontre seu próximo livro</p>

      <div class="forms">
        <form action="{{ url_for('buscar_nome') }}" method="post" class="search-form">
          <label for="titulo">Digite o nome do livro</label>
          <input id="titulo" name="titulo" type="text" placeholder="Ex.: Dom Casmurro" required>
          <button type="submit">Buscar por nome</button>
        </form>

        <div class="divider">ou</div>

        <form action="{{ url_for('buscar_isbn') }}" method="post" class="search-form">
          <label for="isbn">Digite o ISBN</label>
          <input id="isbn" name="isbn" type="text" placeholder="Ex.: 978..." required>
          <button type="submit">Buscar por ISBN</button>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
